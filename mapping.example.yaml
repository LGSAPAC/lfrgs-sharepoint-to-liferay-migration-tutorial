# Per-site migration decisions. Copy to mapping.yaml; every key is optional.

locale: en_US

site:
  name: Marketing            # Liferay site name (default: SharePoint site title)
  key: marketing             # friendly URL -> /web/marketing (default: last segment of the SP site path)

space:
  name: Marketing Content    # CMS Space for migrated list content (default: "<site> Content")
  key: marketing-content

lists:
  # Default target for every custom list (see docs/06-lists-cms-or-objects.md):
  #   auto    -> score each list; content lists -> cms, process/app lists -> objects (reasons in plan.md)
  #   cms     -> content structure in the CMS Space (editorial content, reused across sites)
  #   objects -> site-scoped Liferay Object (views, validations, actions, workflow, Forms)
  target: auto
  overrides:
    "Product Catalog":       # Scenario A: published content
      target: cms
      name: Product          # object definition name (PascalCase)
      pluralLabel: Products  # drives the REST path /o/c/products
    "Support Requests":      # Scenario B: a business process
      target: objects
      skipFields: [LegacyTicketNo]
    "Old Archive":
      skip: true

libraries:
  skip: [Archive 2015]       # document libraries to leave behind
  metadata: documentType     # documentType (Document Type per library) | description (metadata as text)

taxonomy:
  scope: global              # global (usable by Spaces, Objects and documents) | site

news:
  target: blogs              # blogs | structure (News CMS structure) | pages
  structureName: News

audit:
  fields: true               # spCreated / spModified / spCreatedBy / spModifiedBy on every migrated record
  impersonate: false         # create records as their original author via doAsUserId (needs Impersonate)

pages:
  skip: [Template.aspx]
  navigationMenuName: SharePoint Navigation

users:
  skipDisabled: true
  exclude:
    - admin@contoso.onmicrosoft.com
    - svc-sharepoint@contoso.com

permissions:
  # SharePoint permission level -> Liferay site role / space role.
  # null role = membership only (Site Member / Asset Library Member can view).
  levels:
    Full Control: {siteRole: Site Owner, spaceRole: Asset Library Owner}
    Design: {siteRole: Site Content Reviewer, spaceRole: Asset Library Administrator}
    Edit: {siteRole: SP Contributor, spaceRole: SP Space Contributor}
    Contribute: {siteRole: SP Contributor, spaceRole: SP Space Contributor}
    Read: {siteRole: null, spaceRole: null}
    # Custom levels from your tenant:
    # Approve: {siteRole: Site Content Reviewer, spaceRole: Asset Library Content Reviewer}
