# Copied to /opt/liferay/portal-ext.properties by the Liferay Docker image.

# --- Tutorial admin (change for anything other than a local sandbox) --------
company.default.web.id=liferay.com
default.admin.email.address.prefix=test
default.admin.password=learn
passwords.default.policy.change.required=false
setup.wizard.enabled=false
terms.of.use.required=false
users.reminder.queries.enabled=false

# --- MCP server (release feature in 2026.Q3) ---------------------------------
# Enabled at startup by osgi/configs/...MCPServerConfiguration.config (or in the UI:
# Control Panel > Instance Settings > Platform > MCP Server > Enabled)
feature.flag.LPD-63311=true
# OAuth 2.0 Authorization Server Metadata (RFC 8414), needed for MCP OAuth discovery
feature.flag.LPD-63415=true

# The new CMS is GA in 2026.Q3, so it needs no feature flag.

# --- Pages ------------------------------------------------------------------------
# In 2026.Q3, POST /o/headless-delivery/v1.0/sites/{id}/site-pages (used by `sp2lr load
# --phase pages`) answers 400 UnsupportedOperationException unless this flag is on.
feature.flag.LPS-178052=true

# --- Migration-friendly limits ------------------------------------------------
# Allow large page definitions and list attachments through the headless APIs
dl.file.max.size=104857600
upload.servlet.request.impl.max.size=104857600

